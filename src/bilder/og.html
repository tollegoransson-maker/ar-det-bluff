<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Newsreader:opsz,wght@6..72,700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .card { width: 1200px; height: 630px; box-sizing: border-box; padding: 0 80px; position: relative; overflow: hidden; color: #0E1113; font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; }
  .bar { height: 18px; margin: 0 -80px; background: #B4142B; }
  .kicker { margin: 64px 0 0; font-weight: 700; font-size: 32px; color: #B4142B; }
  h1 { margin: 32px 0 0; font-family: "Newsreader", Georgia, serif; font-weight: 700; font-size: 136px; line-height: 1; letter-spacing: -0.02em; }
  .sub { margin: 30px 0 0; font-size: 44px; line-height: 1.25; max-width: 900px; text-wrap: balance; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 52px; padding-top: 22px; border-top: 2px solid #D5D9DD; font-size: 28px; color: #4A535C; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <p class="kicker">Varning för bedragare</p>
  <h1>Är det bluff?</h1>
  <p class="sub">Kolla ett sms, ett mejl eller ett samtal innan du gör något.</p>
  <p class="foot">Gratis och på svenska. Lägg på om någon ringer och ber dig använda BankID.</p>
</div>
</body>
</html>
