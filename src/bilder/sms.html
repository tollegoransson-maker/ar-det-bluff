<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { --bg: #FFFFFF; --bubble: #E9E9EB; --text: #000000; --meta: #8A8A8E; font-family: "Segoe UI", Arial, sans-serif; }
  body.dark { --bg: #000000; --bubble: #262628; --text: #FFFFFF; --meta: #8D8D93; }
  .screen { width: 500px; padding: 24px 20px 40px; box-sizing: border-box; }
  .from { color: var(--text); font-weight: 600; font-size: 17px; text-align: center; margin: 0 0 4px; }
  .time { color: var(--meta); font-size: 13px; text-align: center; margin: 0 0 12px; }
  .bubble { background: var(--bubble); color: var(--text); border-radius: 18px; padding: 10px 14px; font-size: 17px; line-height: 1.3; max-width: 340px; }
</style>
</head>
<body>
<div class="screen">
  <p class="from">+46 70 174 06 35</p>
  <p class="time">Idag 09:41</p>
  <div class="bubble">PostNord: Ditt paket kan inte levereras på grund av ofullständig adress. Bekräfta din adress inom 12 timmar: https://postnord-leverans.example/se</div>
</div>
<script>if (location.hash === '#dark') document.body.className = 'dark';</script>
</body>
</html>
